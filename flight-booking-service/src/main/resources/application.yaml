server:
  port: 8081

spring:
  application:
    name: flight-booking-service


  datasource:
    url: jdbc:postgresql://localhost:5435/postgres
    username: aanshatem
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

logging:
  level:
    org.learnjava: DEBUG
    org.hibernate.SQL: DEBUG
