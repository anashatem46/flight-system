server:
  port: 8082

spring:
  application:
    name: flight-system


  datasource:
    url: jdbc:postgresql://localhost:5432/flight_user_db
    username: aanshatem
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

internal:
  token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}

logging:
  level:
    org.learnjava: DEBUG
    org.hibernate.SQL: DEBUG
